    <!-- The sea marker (traced from public/models/island/sea_marker.glb) bobs on the loader's hop. The colours
         and the hop keyframes repeat src/styles/base.css and keyframes.css, because this page is served as a
         static file without the app; voyage.test.ts fails if the keyframes drift apart. -->
    <style>
      :root {
        --lantern: #f0b35b;
        --lantern-glow-20: rgba(240, 179, 91, 0.2);
        --lantern-glow-35: rgba(240, 179, 91, 0.35);
        --sea-deep: #06101f;
        --sea-night: #0b1e3f;
        --ease-brand: cubic-bezier(0.2, 0.8, 0.2, 1);
        --horizon: 58%;
        --buoy-width: 64px;
        color-scheme: dark;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        overflow: hidden;
        background: linear-gradient(180deg, var(--sea-deep), var(--sea-night));
        color: #ffffff;
        font-family: "Rajdhani", sans-serif;
      }

      main {
        position: relative;
        height: 100%;
      }

      .buoy {
        position: absolute;
        left: 50%;
        bottom: calc(100% - var(--horizon) - var(--buoy-width) * 0.3);
        width: var(--buoy-width);
        transform: translateX(-50%);
      }

      .buoy-hop {
        animation: hopLift 668ms infinite;
      }

      .buoy-squash {
        position: relative;
        transform-origin: 50% 100%;
        animation: hopSquash 668ms infinite;
      }

      .buoy svg {
        display: block;
        width: 100%;
        height: auto;
        fill: rgba(226, 236, 255, 0.92);
      }

      .buoy-lantern {
        position: absolute;
        left: 49.9%;
        top: 7.4%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: var(--lantern);
      }

      .buoy-lantern::after {
        content: "";
        position: absolute;
        inset: -9px;
        border-radius: 50%;
        background: radial-gradient(circle, var(--lantern-glow-35), rgba(240, 179, 91, 0) 70%);
        animation: hopGlow 668ms infinite;
      }

      .depths {
        position: absolute;
        left: 0;
        right: 0;
        top: var(--horizon);
        bottom: 0;
        background: linear-gradient(180deg, rgba(6, 16, 31, 0.5), rgba(6, 16, 31, 0.9));
      }

      .wave {
        position: absolute;
        left: 0;
        top: calc(var(--horizon) - 6px);
        width: 100%;
        height: 12px;
        fill: none;
        stroke: rgba(220, 232, 255, 0.4);
        stroke-width: 2px;
      }

      .message {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(var(--horizon) + 56px);
        padding: 0 24px;
        text-align: center;
      }

      h1 {
        font-family: "Orbitron", monospace;
        font-size: clamp(17px, 2.4vw, 24px);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: rgba(255, 255, 255, 0.92);
      }

      .harbor-link {
        position: relative;
        display: inline-block;
        margin-top: 28px;
        padding: 10px 22px;
        border: 1px solid rgba(255, 255, 255, 0.42);
        border-radius: 999px;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-decoration: none;
        text-transform: uppercase;
        transition: transform 240ms var(--ease-brand);
      }

      .harbor-link::before {
        content: "";
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        box-shadow: 0 0 18px 2px var(--lantern-glow-20);
        opacity: 0;
        transition: opacity 240ms var(--ease-brand);
        pointer-events: none;
      }

      .harbor-link:hover {
        transform: translateY(-2px);
      }

      .harbor-link:hover::before,
      .harbor-link:focus-visible::before {
        opacity: 1;
      }

      .harbor-link:focus-visible {
        outline: 2px solid var(--lantern);
        outline-offset: 2px;
      }

      @media (min-width: 768px) {
        :root {
          --buoy-width: 80px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .buoy-hop,
        .buoy-squash,
        .buoy-lantern::after {
          animation: none;
        }

        .harbor-link:hover {
          transform: none;
        }
      }

      @keyframes hopLift {
        0% {
          transform: translateY(0);
          animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
        }
        35.928% {
          transform: translateY(-62%);
          animation-timing-function: linear;
        }
        59.132% {
          transform: translateY(-62%);
          animation-timing-function: cubic-bezier(0.2, 0.118, 0.6, 0.471);
        }
        79.566% {
          transform: translateY(-40.92%);
          animation-timing-function: cubic-bezier(0.4, 0.318, 0.7, 0.576);
        }
        100% {
          transform: translateY(0);
        }
      }

      @keyframes hopSquash {
        0% {
          transform: scaleY(0.73);
          animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
        }
        10.479% {
          transform: scaleY(1.27);
          animation-timing-function: cubic-bezier(0.5, 1, 0.89, 1);
        }
        23.952% {
          transform: scaleY(1);
          animation-timing-function: linear;
        }
        92.515% {
          transform: scaleY(1);
          animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0);
        }
        100% {
          transform: scaleY(0.73);
        }
      }

      @keyframes hopGlow {
        0%,
        100% {
          opacity: 0.45;
        }
        35.928%,
        59.132% {
          opacity: 1;
        }
      }
    </style>
  </head>
